<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finding Mass Times...</title>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            padding: 50px;
            background-color: #f4f4f4;
        }
        .message {
            font-size: 1.2em;
            color: #333;
        }
    </style>
</head>
<body>

    <div class="message">
        <p>📍 Locating you to find the nearest mass times...</p>
        <p>Please click <strong>"Allow"</strong> if asked for location permission.</p>
    </div>

    <script>
        function redirectToMesses(position) {
            var lat = position.coords.latitude;
            var lon = position.coords.longitude;
            
            // Messes.info accepts coordinates in the URL directly
            // Format: https://messes.info/horaires/LAT:LON
            var targetUrl = "https://messes.info/horaires/" + lat + ":" + lon;
            
            window.location.href = targetUrl;
        }

        function handleError(error) {
            // If location is denied or fails, fallback to the homepage
            alert("Could not get location. Redirecting to the main search page.");
            window.location.href = "https://messes.info/";
        }

        // Run the geolocation check immediately
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(redirectToMesses, handleError);
        } else {
            alert("Geolocation is not supported by this browser.");
            window.location.href = "https://messes.info/";
        }
    </script>

</body>
</html>
